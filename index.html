<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — NutriTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #2d5016;
            --forest-mid: #3d6b1f;
            --forest-light: #4a7c2a;
            --black: #0a0a0a;
            --ash: #b0b7b0;
            --ash-light: #d4d9d4;
            --ash-dark: #7a827a;
            --white: #f5f7f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(176,183,176,0.1);
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--forest-light);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-logo span { color: var(--ash); }

        .nav-links { display: flex; gap: 30px; list-style: none; }

        .nav-links a {
            color: var(--ash);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
            padding-bottom: 3px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--forest-light);
            border-bottom: 2px solid var(--forest-light);
        }

        #themeToggle {
            background: var(--forest);
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
        }

        main {
            position: relative;
            z-index: 1;
            padding: 120px 50px 60px;
            max-width: 1100px;
            margin: 0 auto;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(176,183,176,0.1);
            color: var(--ash-dark);
            font-size: 0.85rem;
            margin-top: 60px;
        }

        footer a { color: var(--forest-light); text-decoration: none; }

        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-links { display: none; }
            main { padding: 100px 20px 40px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">Nutri<span>Track</span></a>

        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="log.html">My Log</a></li>
        </ul>

        <button id="themeToggle"></button>
    </nav>

    <main>
        <!-- Your homepage content here -->
        <h1>Welcome to NutriTrack</h1>
        <p>Track your foods, nutrients, and health goals easily.</p>
    </main>

    <footer>
        <p>Powered by <a href="https://spoonacular.com/food-api" target="_blank">Spoonacular API</a> &nbsp;|&nbsp; NutriTrack &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
